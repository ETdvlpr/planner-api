# Log format for the Planner vhost.
#
# Installed to /etc/nginx/conf.d/planner-log-format.conf. A `log_format` may
# only be declared at the http level, so this is the one file Planner adds
# outside its own vhost — it defines a new named format and changes no
# existing one, so no other vhost's logging is affected.
log_format planner '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time '
                   'cf=$http_cf_ray';
