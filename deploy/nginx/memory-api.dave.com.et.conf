# Planner API — memory-api.dave.com.et
#
# Behind Cloudflare (proxied). Cloudflare terminates TLS at the edge and
# re-encrypts to this origin; the origin certificate lives in
# /etc/ssl/planner/ and is NOT managed by certbot.
#
# That is deliberate. certbot.service on this box is in a failed state with two
# already-expired certificates across eight vhosts; adding a ninth domain to
# that renewal set would put this service's availability behind a mechanism
# that is already broken, and risk disturbing the others. A Cloudflare Origin
# Certificate is valid for 15 years and needs no renewal machinery at all.

# ── Access log, separate from every other vhost ─────────────────────────────
# `planner` log format records the upstream response time and the real client
# IP, and is defined in /etc/nginx/conf.d/planner-log-format.conf.

# Port 80 serves the API rather than redirecting to HTTPS.
#
# Cloudflare is the TLS terminator. Which port it uses to reach this origin
# depends on the zone's SSL mode: Flexible talks HTTP, Full and Full (strict)
# talk HTTPS. A 301 here would produce a redirect loop in Flexible mode, so
# both ports serve and Cloudflare decides.
#
# Once the zone is on Full (strict) — the intended end state — this block can
# become a redirect, and `deploy/harden-http.sh` does exactly that.
server {
    listen 80;
    listen [::]:80;
    server_name memory-api.dave.com.et;

    include /etc/nginx/snippets/planner-cloudflare-real-ip.conf;

    access_log /var/log/nginx/memory-api.access.log planner;
    error_log  /var/log/nginx/memory-api.error.log;

    client_max_body_size 4m;
    client_body_timeout  30s;

    location ^~ /api/v1/docs {
        auth_basic "Planner API docs";
        auth_basic_user_file /etc/nginx/.htpasswd-planner;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

server {
    # `listen … ssl http2` rather than the standalone `http2 on;` directive:
    # this box runs nginx 1.24, and `http2 on;` was only added in 1.25.1.
    #
    # http2 appears on the IPv4 listen only. Protocol options are a property of
    # the listening socket, not the vhost, and another vhost on this box already
    # sets them for [::]:443 — repeating them here logs "protocol options
    # redefined" into the shared error log on every reload without changing
    # anything.
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name memory-api.dave.com.et;

    include /etc/nginx/snippets/planner-cloudflare-real-ip.conf;

    ssl_certificate     /etc/ssl/planner/origin.pem;
    ssl_certificate_key /etc/ssl/planner/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PlannerSSL:2m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/memory-api.access.log planner;
    error_log  /var/log/nginx/memory-api.error.log;

    # Bytes never pass through the API — attachments are PUT straight to R2 with
    # a presigned URL — so this only has to admit JSON. A 500-row sync push sits
    # comfortably inside 4 MB; anything larger is a client bug, and rejecting it
    # at the edge keeps it off the single shared vCPU.
    client_max_body_size 4m;
    client_body_timeout  30s;

    # The API sets its own security headers via helmet; these cover the cases
    # helmet cannot, on responses nginx generates itself.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ── Swagger: not public ─────────────────────────────────────────────────
    # The docs describe every endpoint including the sync protocol. There is no
    # reason for that to be crawlable or enumerable.
    location ^~ /api/v1/docs {
        auth_basic "Planner API docs";
        auth_basic_user_file /etc/nginx/.htpasswd-planner;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;
    }

    # ── Health: unauthenticated, unlogged, un-throttled ─────────────────────
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/planner-proxy.conf;

        # A sync pull spans thirteen tables on a shared vCPU. 60s is generous
        # but finite; the client retries with the same cursor, which is safe
        # because pull is idempotent.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
