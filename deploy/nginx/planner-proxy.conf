# Shared proxy headers for the Planner vhost.
#
# Installed to /etc/nginx/snippets/planner-proxy.conf. Deliberately a private
# snippet rather than an edit to the box's shared /etc/nginx/proxy_params, so
# nothing here can change how the other eight vhosts proxy.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_redirect off;
